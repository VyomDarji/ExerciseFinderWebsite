<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Exercise Recommender</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2f;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
  
    h1 {
      color: #ffffff;
      margin-bottom: 20px;
    }
  
    form {
      background-color: #2c2c3c;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      margin-bottom: 30px;
      display: flex;                  
      flex-direction: column;         
      align-items: center;        
    }
  
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }
  
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  
    input[type="checkbox"] {
      accent-color: #4ade80;
      width: 18px;
      height: 18px;
    }
  
    button {
      padding: 10px 20px;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
      margin-top: 10px;            
    }
  
    button:hover {
      background-color: #4338ca;
    }
  
    #result {
      width: 100%;
      max-width: 700px;
    }
  
    h2 {
      margin-top: 20px;
      color: #a78bfa;
    }
  
    ul {
      list-style-type: none;
      padding: 0;
    }
  
    li {
      background-color: #2c2c3c;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <h1>💪 Exercise Finder</h1>
  <form id="muscleForm">
    <div class="checkbox-group">
      <label><input type="checkbox" name="muscle" value="biceps" /> Biceps</label>
      <label><input type="checkbox" name="muscle" value="triceps" /> Triceps</label>
      <label><input type="checkbox" name="muscle" value="chest" /> Chest</label>
      <label><input type="checkbox" name="muscle" value="back" /> Back</label>
      <label><input type="checkbox" name="muscle" value="leg" /> Legs</label>
      <label><input type="checkbox" name="muscle" value="shoulder" /> Shoulders</label>
    </div>
    <button type="submit">Get Exercises</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('muscleForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultDiv.innerHTML = '';

      const checkboxes = document.querySelectorAll('input[name="muscle"]:checked');
      const selectedMuscles = Array.from(checkboxes).map(cb => cb.value);

      if (selectedMuscles.length === 0) {
        resultDiv.innerHTML = '<p>Please select at least one muscle group.</p>';
        return;
      }

      for (const muscle of selectedMuscles) {
        try {
          const response = await fetch(`http://localhost:5000/api/exercise/${muscle}`, {
            headers: {
              'x-api-key': 'vyom301004'
            }
          });

          const data = await response.json();

          if (data.success) {
            resultDiv.innerHTML += `
              <h2>${data.muscle.charAt(0).toUpperCase() + data.muscle.slice(1)}</h2>
              <ul>
                ${data.exercises.map(ex => `<li>${ex.name} - ${ex.sets} sets x ${ex.reps} reps</li>`).join('')}
              </ul>`;
          } else {
            resultDiv.innerHTML += `<p>${data.message}</p>`;
          }
        } catch (err) {
          resultDiv.innerHTML += `<p>Error fetching ${muscle} exercises. Try again later.</p>`;
        }
      }
    });
  </script>
</body>
</html>
